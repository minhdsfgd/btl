name: Java CI with Maven

# Định nghĩa khi nào CI sẽ được chạy
on:
  push:
    branches: [ "main", "master" ] # Chạy khi có code push lên nhánh main/master
  pull_request:
    branches: [ "main", "master" ] # Chạy khi có ai đó tạo Pull Request vào nhánh main/master

jobs:
  build-and-test:
    # Chọn hệ điều hành cho server chạy CI. 
    # Lưu ý: Do bạn dùng JavaFX, nếu có test UI, bạn có thể đổi thành 'windows-latest' hoặc 'macos-latest' để tránh lỗi thiếu giao diện đồ họa trên Linux.
    runs-on: ubuntu-latest

    steps:
    # Bước 1: Kéo code của bạn từ GitHub về server CI
    - name: Checkout Code
      uses: actions/checkout@v4

    # Bước 2: Cài đặt môi trường Java 25 theo như pom.xml của bạn
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25' # Đã cập nhật lên Java 25
        distribution: 'temurin' # Có thể dùng 'oracle', 'corretto' hoặc 'zulu'
        cache: maven # Tự động cache các thư viện maven tải về để lần sau chạy nhanh hơn

    # Bước 3: Cấp quyền thực thi cho file Maven Wrapper (nếu bạn dùng mvnw)
    - name: Grant execute permission for mvnw
      run: chmod +x btl/BaiTapLon/mvnw

    # Bước 4: Chạy build, test, checkstyle và jacoco
    # Chú ý đường dẫn (-f btl/BaiTapLon/pom.xml) trỏ đúng tới nơi chứa pom.xml
    - name: Build and Test with Maven
      run: ./btl/BaiTapLon/mvnw clean verify -f btl/BaiTapLon/pom.xml
      
    # (Tùy chọn) Bước 5: Lưu lại file báo cáo Test và Coverage (JaCoCo) sau khi chạy xong
    - name: Upload JaCoCo Coverage Report
      uses: actions/upload-artifact@v4
      if: always() # Luôn chạy dù test pass hay fail
      with:
        name: jacoco-report
        path: btl/BaiTapLon/target/site/jacoco/