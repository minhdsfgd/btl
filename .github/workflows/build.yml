name: Qodana Code Scan

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  qodana:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2023.3 
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}