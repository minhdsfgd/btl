name: Java CI with Maven and Qodana Scan

on:
  push:
    branches: [ "main", "master", "develop", "dev" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công trên GitHub

jobs:
  build-test-and-scan:
    runs-on: ubuntu-latest
    
    # Cấp quyền cho Qodana viết bình luận/tạo báo cáo check lỗi trên Pull Request
    permissions:
      contents: write
      pull-requests: write
      checks: write

    steps:
      # Step 1: Lấy mã nguồn (Checkout source code với đầy đủ lịch sử commit cho Qodana)
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # Step 2: Cài đặt JDK  và cấu hình bộ nhớ đệm Cache cho Maven
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'

      # Step 3: Cấp quyền chạy cho Maven Wrapper
      # name: Make Maven Wrapper executable
      # run: chmod +x mvnw

      # Step 4: Biên dịch dự án (Build project)
      - name: Build project
        run: mvn clean compile

      # Step 5: Tự động chạy tất cả các bài Unit Test
      - name: Run tests
        run: mvn test

      # Step 6: Đóng gói ứng dụng thành file .jar/.war (Bỏ qua chạy lại test để tiết kiệm thời gian)
      - name: Package application
        run: mvn -DskipTests package

      # Step 7 (Bổ sung): Quét và phân tích chất lượng/bảo mật mã nguồn bằng Qodana
      - name: Qodana Scan
        uses: JetBrains/qodana-action@main
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
