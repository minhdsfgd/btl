name: Java CI with Maven

on:
  push:
    branches: [ "main","dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-

    defaults:
      run:
        working-directory: BaiTapLon

    steps:

      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y

      - name: Build with Maven
        run: xvfb-run mvn -B package -DskipTests


      - name: Run Tests with Maven
        run: xvfb-run mvn test